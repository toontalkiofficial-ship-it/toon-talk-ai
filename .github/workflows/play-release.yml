name: Build Toon Talk AI Play Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project in repository or ZIP sources
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle || -f settings.gradle.kts ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ROOT="$RUNNER_TEMP/ttai-extracted"
            mkdir -p "$ROOT"
            mapfile -d '' archives < <(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -iname '*.zip' -not -path '*/.git/*' -print0)
            if [[ "${#archives[@]}" -eq 0 ]]; then
              echo "::error::No root Gradle project or ZIP source found in the repository."
              exit 1
            fi
            for archive in "${archives[@]}"; do
              target="$ROOT/$(basename "${archive%.zip}")"
              mkdir -p "$target"
              echo "Extracting $(basename "$archive")"
              unzip -oq "$archive" -d "$target"
            done
            for round in 1 2 3 4; do
              mapfile -d '' nested < <(find "$ROOT" -type f -iname '*.zip' -print0)
              [[ "${#nested[@]}" -gt 0 ]] || break
              for archive in "${nested[@]}"; do
                target="${archive%.zip}-extracted"
                if [[ ! -d "$target" ]]; then
                  mkdir -p "$target"
                  unzip -oq "$archive" -d "$target"
                fi
              done
            done
            settings_file=$(find "$ROOT" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
            if [[ -z "$settings_file" ]]; then
              echo "::error::settings.gradle(.kts) was not found inside the ZIP sources."
              find "$ROOT" -maxdepth 6 -type f | head -160
              exit 1
            fi
            PROJECT_DIR="$(dirname "$settings_file")"
          fi
          if [[ ! -f "$PROJECT_DIR/app/build.gradle" && ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "::error::app/build.gradle(.kts) was not found in $PROJECT_DIR"
            exit 1
          fi
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Validate required release secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD SUPABASE_URL SUPABASE_PUBLISHABLE_KEY ADMOB_APP_ID ADMOB_BANNER_ID; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            printf '::error::Missing required GitHub Actions secrets: %s\n' "${missing[*]}"
            echo "Open Settings > Secrets and variables > Actions and add the missing secrets. Do not put secret values in source code."
            exit 1
          fi

      - name: Decode and validate release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
          test -s "$GITHUB_WORKSPACE/release.keystore"
          file "$GITHUB_WORKSPACE/release.keystore"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release AAB
        shell: bash
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          gradle --no-daemon --stacktrace bundleRelease
          test -f app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Toon-Talk-AI-Play-Release-AAB
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
