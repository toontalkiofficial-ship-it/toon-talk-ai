name: Build Toon Talk AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle || -f settings.gradle.kts ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            mkdir -p "$RUNNER_TEMP/ttai-extracted"
            ROOT="$RUNNER_TEMP/ttai-extracted"
            mapfile -d '' archives < <(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -iname '*.zip' -not -path '*/.git/*' -print0)
            if [[ "${#archives[@]}" -eq 0 ]]; then
              echo "ERROR: No root Gradle project or ZIP source found."
              exit 1
            fi
            for archive in "${archives[@]}"; do
              target="$ROOT/$(basename "${archive%.zip}")"
              mkdir -p "$target"
              echo "Extracting $archive"
              unzip -oq "$archive" -d "$target"
            done
            for round in 1 2 3 4; do
              mapfile -d '' nested < <(find "$ROOT" -type f -iname '*.zip' -print0)
              [[ "${#nested[@]}" -gt 0 ]] || break
              for archive in "${nested[@]}"; do
                target="${archive%.zip}-extracted"
                if [[ ! -d "$target" ]]; then
                  mkdir -p "$target"
                  unzip -oq "$archive" -d "$target"
                fi
              done
            done
            settings_file=$(find "$ROOT" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
            if [[ -z "$settings_file" ]]; then
              echo "ERROR: settings.gradle(.kts) not found in ZIP sources."
              find "$ROOT" -maxdepth 6 -type f | head -160
              exit 1
            fi
            PROJECT_DIR="$(dirname "$settings_file")"
          fi
          if [[ ! -f "$PROJECT_DIR/app/build.gradle" && ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "ERROR: app/build.gradle(.kts) missing in $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 4 -type f | head -120
            exit 1
          fi
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          gradle --no-daemon --stacktrace -PSUPABASE_URL="$SUPABASE_URL" -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/apk-artifact"
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/apk-artifact/" \;
          test -n "$(find "$GITHUB_WORKSPACE/apk-artifact" -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Toon-Talk-AI-APK
          path: apk-artifact/*.apk
          if-no-files-found: error
