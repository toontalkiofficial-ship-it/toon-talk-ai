
name: Build Toon Talk AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP not found in repository root"
            exit 1
          fi
          mkdir -p project
          unzip -q "$ZIP" -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          SETTINGS=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found in project ZIP"
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Toon-Talk-AI-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
