
name: Build Toon Talk AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project

          ZIP="$(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' | head -n 1)"

          if [[ -z "$ZIP" ]]; then
            echo "ERROR: Repository mein koi ZIP file nahi mili."
            exit 1
          fi

          echo "Extracting: $ZIP"
          unzip -oq "$ZIP" -d project

          echo "Extracted project files:"
          find project -maxdepth 4 -type f | head -n 80

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$(find project -type f \( -name build.gradle -o -name build.gradle.kts \) -not -path '*/build/*' | head -n 1)"

          if [[ -z "$BUILD_FILE" ]]; then
            echo "ERROR: Android Gradle build file nahi mili."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"

          while [[ "$PROJECT_DIR" != "." && ! -f "$PROJECT_DIR/settings.gradle" && ! -f "$PROJECT_DIR/settings.gradle.kts" ]]; do
            PROJECT_DIR="$(dirname "$PROJECT_DIR")"
          done

          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Toon-Talk-AI-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
