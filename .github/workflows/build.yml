name: Build Toon Talk AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          mapfile -d '' ZIPS < <(find . -maxdepth 1 -type f -iname "*.zip" -print0)
          if [ "\${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP files found in repository root"
            exit 1
          fi
          for ZIP in "\${ZIPS[@]}"; do
            echo "Extracting $ZIP"
            unzip -oq "$ZIP" -d project
          done

          for ROUND in 1 2 3; do
            SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
            if [ -n "$SETTINGS" ]; then
              break
            fi
            mapfile -d '' NESTED_ZIPS < <(find project -type f -iname "*.zip" -print0)
            if [ "\${#NESTED_ZIPS[@]}" -eq 0 ]; then
              break
            fi
            for ZIP in "\${NESTED_ZIPS[@]}"; do
              echo "Extracting nested archive $ZIP"
              unzip -oq "$ZIP" -d project
              rm -f "$ZIP"
            done
          done

          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found after extracting project ZIPs"
            echo "Files extracted:"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "Android project found at $(dirname "$SETTINGS")"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          cd "$(dirname "$SETTINGS")"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Toon-Talk-AI-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
