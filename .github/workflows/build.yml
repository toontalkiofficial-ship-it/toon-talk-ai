name: Build Toon Talk AI APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo 'ERROR: Project ZIP not found in repository root.'
            exit 1
          fi
          mkdir -p project
          unzip -q "$ZIP" -d project
          echo 'Project ZIP extracted.'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        shell: bash
        run: |
          GRADLEW=$(find project -type f -name gradlew -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo 'ERROR: gradlew not found. The ZIP may not contain a complete Android project.'
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Toon-Talk-AI-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
